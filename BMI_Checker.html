<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BMI Checker (Height in cm)</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .bmi-box {
            max-width: 500px;
            margin: 80px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 25px;
        }
        input {
            margin: 8px;
            padding: 10px;
            width: 220px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            margin-top: 15px;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-weight: 500;
            transition: 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
        }
        .normal { color: green; }
        .underweight { color: blue; }
        .overweight { color: orange; }
        .obese { color: red; }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="Main.html">Home</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" 
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="Personal_Info.html">Personal Info</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="toolsDropdown" 
                           role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Tools
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="toolsDropdown">
                            <li><a class="dropdown-item" href="Simple_Calculator_program.html">Simple Calculator</a></li>
                            <li><a class="dropdown-item" href="BMI_Checker.html">BMI Checker</a></li>
                            <li><a class="dropdown-item" href="Income_tax_Calculator.html">Income Tax Calculator</a></li>
                            <li><a class="dropdown-item" href="Unit_Converter.html">Unit Converter</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- BMI Box -->
    <div class="bmi-box">
        <h2>BMI Checker</h2>
        <label>Weight (kg):</label><br>
        <input type="number" id="weight" placeholder="Enter weight"><br>
        <label>Height (cm):</label><br>
        <input type="number" id="height" placeholder="Enter height in cm"><br>
        <button onclick="calculateBMI()">Check BMI</button>
        <p id="result"></p>
    </div>

    <script>
        function calculateBMI() {
            let weight = parseFloat(document.getElementById("weight").value);
            let heightCm = parseFloat(document.getElementById("height").value);

            if (weight > 0 && heightCm > 0) {
                let heightM = heightCm / 100;
                let bmi = (weight / (heightM * heightM)).toFixed(2);
                let category = "";
                let cssClass = "";

                if (bmi < 18.5) {
                    category = "Underweight";
                    cssClass = "underweight";
                } else if (bmi >= 18.5 && bmi < 24.9) {
                    category = "Normal weight";
                    cssClass = "normal";
                } else if (bmi >= 25 && bmi < 29.9) {
                    category = "Overweight";
                    cssClass = "overweight";
                } else {
                    category = "Obese";
                    cssClass = "obese";
                }

                document.getElementById("result").innerHTML = 
                    "Your BMI is <strong>" + bmi + "</strong> (" + category + ")";
                document.getElementById("result").className = cssClass;
            } else {
                document.getElementById("result").innerHTML = 
                    "⚠️ Please enter valid weight and height.";
                document.getElementById("result").className = "";
            }
        }
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
