<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Calculator</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .calculator-box {
      max-width: 500px;
      margin: 80px auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    h2 {
      color: #333;
      margin-bottom: 25px;
    }
    input {
      margin: 8px;
      padding: 10px;
      width: 140px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      margin: 5px;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: white;
      font-weight: 500;
      transition: 0.3s;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="Main.html">Home</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
              data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" 
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="Personal_Info.html">Personal Info</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="toolsDropdown" 
               role="button" data-bs-toggle="dropdown" aria-expanded="false">
              Tools
            </a>
            <ul class="dropdown-menu" aria-labelledby="toolsDropdown">
              <li><a class="dropdown-item" href="Simple_Calculator_program.html">Simple Calculator</a></li>
              <li><a class="dropdown-item" href="BMI_Checker.html">BMI Checker</a></li>
              <li><a class="dropdown-item" href="Income_tax_Calculator.html">Income Tax Calculator</a></li>
              <li><a class="dropdown-item" href="Unit_Converter.html">Unit Converter</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Calculator Box -->
  <div class="calculator-box">
    <h2>Simple Calculator</h2>
    <div>
      <input type="number" id="num1" placeholder="First number">
      <input type="number" id="num2" placeholder="Second number">
      <input type="text" id="result" readonly placeholder="Result">
    </div>
    <div>
      <button onclick="add()">Add</button>
      <button onclick="subtract()">Subtract</button>
      <button onclick="multiply()">Multiply</button>
      <button onclick="divide()">Divide</button>
      <button onclick="clearAll()">Clear</button>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    function add() {
      document.getElementById("result").value =
        Number(document.getElementById("num1").value) + Number(document.getElementById("num2").value);
    }
    function subtract() {
      document.getElementById("result").value =
        Number(document.getElementById("num1").value) - Number(document.getElementById("num2").value);
    }
    function multiply() {
      document.getElementById("result").value =
        Number(document.getElementById("num1").value) * Number(document.getElementById("num2").value);
    }
    function divide() {
      document.getElementById("result").value =
        Number(document.getElementById("num1").value) / Number(document.getElementById("num2").value);
    }
    function clearAll() {
      document.getElementById("num1").value = "";
      document.getElementById("num2").value = "";
      document.getElementById("result").value = "";
    }
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
