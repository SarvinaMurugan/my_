<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Income Tax Calculator</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .tax-box {
      max-width: 500px;
      margin: 80px auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    h2 {
      color: #333;
      margin-bottom: 25px;
    }
    input {
      margin: 8px;
      padding: 10px;
      width: 220px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .btn-custom {
      margin: 5px;
      padding: 10px 20px;
      border-radius: 5px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="Main.html">Home</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
              data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" 
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="Personal_Info.html">Personal Info</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="toolsDropdown" 
               role="button" data-bs-toggle="dropdown" aria-expanded="false">
              Tools
            </a>
            <ul class="dropdown-menu" aria-labelledby="toolsDropdown">
              <li><a class="dropdown-item" href="Simple_Calculator_program.html">Simple Calculator</a></li>
              <li><a class="dropdown-item" href="BMI_Checker.html">BMI Checker</a></li>
              <li><a class="dropdown-item" href="Income_tax_Calculator.html">Income Tax Calculator</a></li>
              <li><a class="dropdown-item" href="Unit_Converter.html">Unit Converter</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Tax Calculator Box -->
  <div class="tax-box">
    <h2>Income Tax Calculator</h2>
    <form>
      <label>Yearly Income (RM):</label><br>
      <input type="number" id="income" placeholder="Enter income"><br>
      
      <label>Tax Amount (RM):</label><br>
      <input type="text" id="result" readonly><br>
      
      <button type="button" class="btn btn-primary btn-custom" onclick="calculateTax()">Calculate</button>
      <button type="button" class="btn btn-secondary btn-custom" onclick="clearForm()">Clear</button>
    </form>
  </div>

  <!-- JavaScript -->
  <script>
    function calculateTax() {
      let income = parseFloat(document.getElementById("income").value);
      let tax = 0;

      if (income <= 5000) {
        tax = 0;
      } else if (income <= 20000) {
        tax = (income - 5000) * 0.01;
      } else if (income <= 35000) {
        tax = 150 + (income - 20000) * 0.03;
      } else if (income <= 50000) {
        tax = 600 + (income - 35000) * 0.08;
      } else if (income <= 70000) {
        tax = 1800 + (income - 50000) * 0.13;
      } else if (income <= 100000) {
        tax = 4400 + (income - 70000) * 0.21;
      } else if (income <= 250000) {
        tax = 10700 + (income - 100000) * 0.24;
      } else if (income <= 400000) {
        tax = 46700 + (income - 250000) * 0.245;
      } else if (income <= 600000) {
        tax = 83450 + (income - 400000) * 0.25;
      } else if (income <= 1000000) {
        tax = 133450 + (income - 600000) * 0.26;
      } else if (income <= 2000000) {
        tax = 237450 + (income - 1000000) * 0.28;
      } else {
        tax = 517450 + (income - 2000000) * 0.30;
      }

      document.getElementById("result").value = "RM " + tax.toFixed(2);
    }

    function clearForm() {
      document.getElementById("income").value = "";
      document.getElementById("result").value = "";
    }
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
