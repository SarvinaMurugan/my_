<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unit Converter</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .converter-box {
            max-width: 500px;
            margin: 80px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 25px;
        }
        input {
            margin: 8px;
            padding: 10px;
            width: 220px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .btn-custom {
            margin: 5px;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: 500;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="Main.html">Home</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" 
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="Personal_Info.html">Personal Info</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="toolsDropdown" 
                           role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Tools
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="toolsDropdown">
                            <li><a class="dropdown-item" href="Simple_Calculator_program.html">Simple Calculator</a></li>
                            <li><a class="dropdown-item" href="BMI_Checker.html">BMI Checker</a></li>
                            <li><a class="dropdown-item" href="Income_tax_Calculator.html">Income Tax Calculator</a></li>
                            <li><a class="dropdown-item" href="Unit_Converter.html">Unit Converter</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Converter Box -->
    <div class="converter-box">
        <h2>Unit Converter</h2>
        <input type="number" id="value" placeholder="Enter value"><br>
        <button class="btn btn-primary btn-custom" onclick="cmToM()">cm → m</button>
        <button class="btn btn-primary btn-custom" onclick="mToCm()">m → cm</button><br>
        <button class="btn btn-success btn-custom" onclick="mToKm()">m → km</button>
        <button class="btn btn-success btn-custom" onclick="kmToM()">km → m</button>
        <p id="result"></p>
    </div>

    <!-- JavaScript -->
    <script>
        function cmToM() {
            let val = parseFloat(document.getElementById("value").value);
            if (!isNaN(val)) {
                document.getElementById("result").innerHTML = val + " cm = " + (val / 100).toFixed(3) + " m";
            } else {
                document.getElementById("result").innerHTML = "⚠️ Please enter a valid number.";
            }
        }

        function mToCm() {
            let val = parseFloat(document.getElementById("value").value);
            if (!isNaN(val)) {
                document.getElementById("result").innerHTML = val + " m = " + (val * 100).toFixed(1) + " cm";
            } else {
                document.getElementById("result").innerHTML = "⚠️ Please enter a valid number.";
            }
        }

        function mToKm() {
            let val = parseFloat(document.getElementById("value").value);
            if (!isNaN(val)) {
                document.getElementById("result").innerHTML = val + " m = " + (val / 1000).toFixed(3) + " km";
            } else {
                document.getElementById("result").innerHTML = "⚠️ Please enter a valid number.";
            }
        }

        function kmToM() {
            let val = parseFloat(document.getElementById("value").value);
            if (!isNaN(val)) {
                document.getElementById("result").innerHTML = val + " km = " + (val * 1000).toFixed(1) + " m";
            } else {
                document.getElementById("result").innerHTML = "⚠️ Please enter a valid number.";
            }
        }
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
